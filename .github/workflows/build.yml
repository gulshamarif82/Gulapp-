name: Build Gulapp APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Create Android Project
        run: |
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Gulapp"
          include ":app"' > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.1' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }" > build.gradle
          mkdir -p app/src/main/java/com/gulsham/gulapp
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.gulsham.gulapp'; compileSdk 34; defaultConfig { applicationId "com.gulsham.gulapp"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Gulapp"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf 'package com.gulsham.gulapp\nimport android.os.Bundle\nimport androidx.appcompat.app.AppCompatActivity\nimport android.widget.TextView\nclass MainActivity : AppCompatActivity() { override fun onCreate(b: Bundle?) { super.onCreate(b); val t = TextView(this); t.text = "Hello Gulapp APK Ready!"; t.textSize = 30f; setContentView(t) } }' > app/src/main/java/com/gulsham/gulapp/MainActivity.kt
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gulapp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
