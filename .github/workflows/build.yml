name: Build Gulapp APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Create Project
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Gulapp"
          include ":app"
          EOF
          echo "plugins { id 'com.android.application' version '8.2.1' apply false }" > build.gradle
          mkdir -p app/src/main/java/com/gulsham/gulapp
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.gulsham.gulapp'
            compileSdk 34
            defaultConfig { applicationId "com.gulsham.gulapp"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          EOF
          mkdir -p app/src/main
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Gulapp"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/gulsham/gulapp/MainActivity.java <<'EOF'
          package com.gulsham.gulapp;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              TextView t = new TextView(this);
              t.setText("Gulapp Ready! Mubarak Ho!");
              t.setTextSize(30);
              t.setPadding(40,200,40,40);
              setContentView(t);
            }
          }
          EOF
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Gulapp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
