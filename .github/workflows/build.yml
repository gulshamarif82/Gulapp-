name: Build Gulapp APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Full Project
        run: |
          mkdir -p app/src/main/java/com/gulsham/gulapp
          echo "rootProject.name=\"Gulapp\"
          include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.1' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }" > build.gradle
          cat > app/build.gradle <<'EOL'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.gulsham.gulapp'; compileSdk 34; defaultConfig { applicationId "com.gulsham.gulapp"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOL
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Gulapp" android:theme="@android:style/Theme.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.gulsham.gulapp; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import android.widget.TextView; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle b){super.onCreate(b); TextView t=new TextView(this); t.setText("Hello Gulapp!"); t.setTextSize(30); setContentView(t);} }' > app/src/main/java/com/gulsham/gulapp/MainActivity.java
      - name: Build APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gulapp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
